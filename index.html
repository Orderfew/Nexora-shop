<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #070b14;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #0e1320;
      border: 1px solid #202a40;
      border-radius: 28px;
      padding: 30px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 17px;
      background: linear-gradient(135deg, #5962ff, #08c9ed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    p {
      color: #8d98ad;
      line-height: 1.5;
    }

    label {
      display: block;
      margin-top: 20px;
      margin-bottom: 8px;
      color: #c2c9d6;
      font-size: 14px;
    }

    input {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      border: 1px solid #29334a;
      background: #080d18;
      color: white;
      padding: 0 15px;
      font-size: 15px;
    }

    button {
      width: 100%;
      height: 52px;
      margin-top: 22px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #5962ff, #08c9ed);
      color: white;
      font-weight: bold;
      font-size: 15px;
    }

    .bottom {
      text-align: center;
      margin-top: 22px;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">N</div>

    <h1>Bienvenue 👋</h1>

    <p>
      Connectez-vous à Nexora pour gérer votre boutique,
      vos commandes et vos clients.
    </p>

    <form>
      <label>Adresse e-mail</label>
      <input type="email" placeholder="vous@exemple.com">

      <label>Mot de passe</label>
      <input type="password" placeholder="••••••••">

      <button type="submit">
        Se connecter
      </button>
    </form>

    <div class="bottom">
      Pas encore de compte ? <strong>Créer un compte</strong>
    </div>

  </div>

</body>
</html>
