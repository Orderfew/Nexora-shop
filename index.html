<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexora — Connexion</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #070b14;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: #0e1320;
      border: 1px solid #202a40;
      border-radius: 28px;
      padding: 30px 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }

    .logo {
      width: 58px;
      height: 58px;
      border-radius: 17px;
      background: linear-gradient(135deg, #5962ff, #08c9ed);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      font-weight: bold;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 30px;
    }

    .description {
      color: #8d98ad;
      line-height: 1.5;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 8px;
      color: #c2c9d6;
      font-size: 14px;
    }

    input {
      width: 100%;
      height: 52px;
      border-radius: 14px;
      border: 1px solid #29334a;
      background: #080d18;
      color: white;
      padding: 0 15px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #5962ff;
    }

    button {
      width: 100%;
      height: 52px;
      margin-top: 24px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #5962ff, #08c9ed);
      color: white;
      font-weight: bold;
      font-size: 15px;
      cursor: pointer;
    }

    .bottom {
      text-align: center;
      margin-top: 22px;
      color: #8d98ad;
      font-size: 14px;
    }

    .bottom span {
      color: #6b8cff;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">N</div>

    <h1>Bienvenue 👋</h1>

    <p class="description">
      Connectez-vous à Nexora pour gérer votre boutique,
      vos commandes et vos clients.
    </p>

    <form onsubmit="window.location.href='dashboard.html'; return false;">

      <label for="email">Adresse e-mail</label>
      <input
        id="email"
        type="email"
        placeholder="vous@exemple.com"
        required
      >

      <label for="password">Mot de passe</label>
      <input
        id="password"
        type="password"
        placeholder="••••••••"
        required
      >

      <button type="submit">
        Se connecter
      </button>

    </form>

    <div class="bottom">
      Pas encore de compte ? <span>Créer un compte</span>
    </div>

  </div>

</body>
</html>
